# cargo-deny configuration (03-architecture.md §2 guardrails).
# Run locally with `cargo deny check`; CI runs the same.

[graph]
all-features = true

[advisories]
# A yanked crate or a known vulnerability fails the build.
yanked = "deny"
ignore = [
    # proc-macro-error is unmaintained (no fix available). It reaches the
    # tree only through the GTK bindings' derive macros behind
    # lockdown-desktop's `shell` feature on Linux, at build time; it runs no
    # code in the shipped binary. Drops out when gtk-rs moves off it.
    { id = "RUSTSEC-2024-0370", reason = "build-time proc macro via gtk3-macros (Tauri on Linux); no runtime code" },
]

[licenses]
# Every dependency must carry one of these licences.
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "CC0-1.0",
    "Unicode-3.0",
    "BSL-1.0",
    # foldhash (via hashbrown ← hashlink ← rusqlite): zlib/libpng, permissive.
    "Zlib",
    # The sync client's TLS stack (reqwest → hyper-rustls → rustls → ring):
    # ring is "Apache-2.0 AND ISC", rustls-webpki carries ISC; both permissive.
    "ISC",
    # webpki-roots' bundled Mozilla root store (via rustls-platform-verifier):
    # a permissive data licence that only asks for attribution of the data.
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.8
# The desktop shell (lockdown-desktop, feature `shell`) pulls five MPL-2.0
# crates through Tauri: option-ext (via dirs) and the HTML/CSS parsers
# Tauri's build step uses to inject the CSP (dom_query → selectors,
# cssparser, cssparser-macros, dtoa-short). MPL-2.0 is weak copyleft at the
# file level, not permissive, so it is not on the list above: each crate is
# allowed by name here, unmodified, and nothing of ours is derived from it.
# Flagged for Sean in docs/plan/10-desktop-shell.md (decisions proposed).
exceptions = [
    { allow = ["MPL-2.0"], crate = "option-ext" },
    { allow = ["MPL-2.0"], crate = "selectors" },
    { allow = ["MPL-2.0"], crate = "cssparser" },
    { allow = ["MPL-2.0"], crate = "cssparser-macros" },
    { allow = ["MPL-2.0"], crate = "dtoa-short" },
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
# The shared identity crate (D34). Pinned by commit in Cargo.toml.
allow-git = ["https://github.com/snds/ecosystem-identity"]
