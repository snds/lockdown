[package]
name = "lockdown-desktop"
description = "The Lockdown desktop shell: Tauri 2 around lockdown-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "lockdown_desktop_lib"
crate-type = ["rlib"]

[[bin]]
name = "lockdown-desktop"
path = "src/main.rs"

[features]
# Tauri, and with it WebKitGTK on Linux, WebView2 on Windows and WKWebView
# on macOS. Off by default so `cargo <anything> --workspace` stays pure
# Rust (the same reason `ffi` and `wasm` sit outside default-members):
# without it this crate is the clipboard rule and a stub `main`.
# `tauri dev` and `tauri build` turn it on through tauri.conf.json
# (`build.features`); the desktop CI job passes it by hand.
shell = [
    "dep:tauri",
    "dep:tauri-build",
    "dep:tauri-plugin-log",
    "dep:tauri-plugin-opener",
    "dep:tauri-plugin-clipboard-manager",
    "dep:keyring",
    "dep:log",
    "dep:tauri-plugin-dialog",
    "dep:tauri-plugin-notification",
]

[build-dependencies]
tauri-build = { version = "2.7.2", optional = true }

[dependencies]
lockdown-app.workspace = true
# The set-up card type the bridges commands hand over (docs/plan/23-bridges.md).
lockdown-security.workspace = true
# Touch ID / Windows Hello for approvals (D99, D101); nothing on Linux.
lockdown-platform-auth.workspace = true
blake3.workspace = true
serde.workspace = true
serde_json.workspace = true
zeroize.workspace = true
# The shell proper.
tauri = { version = "2.12.3", optional = true }
tauri-plugin-log = { version = "2", optional = true }
# Opens an item's site in the default browser (http and https only).
tauri-plugin-opener = { version = "2", optional = true }
# The copy path: a secret goes from the core to the clipboard without
# touching the webview, and is cleared from here (clipboard.rs).
tauri-plugin-clipboard-manager = { version = "2.5", optional = true }
# OS keychain for the session token: macOS Keychain, Windows Credential
# Manager, Secret Service on Linux (lockdown_app::secrets).
keyring = { version = "3.6", features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust"], optional = true }
log = { version = "0.4", optional = true }
# The OS's own save and folder dialogs for export and backups, opened from
# Rust only; no dialog or fs permission reaches the webview.
tauri-plugin-dialog = { version = "2.8", optional = true }
# OS notifications for a new device's sign-in and a security key change
# (docs/plan/25-self-host-2.md §5), shown from Rust only; the webview gets
# no notification permission.
tauri-plugin-notification = { version = "2", optional = true }
# The browser extension's endpoint (src/browser/, docs/plan/16-browser-extension.md):
# the channel's shared rules, the Unix socket and the process-identity check
# from the identity crate (D4, D33), the matcher for a result's host, HMAC
# for the pairing proof, and the OS random source for codes and challenges.
lockdown-native-messaging.workspace = true
lockdown-matcher.workspace = true
ecosystem-identity.workspace = true
hmac.workspace = true
sha2.workspace = true
getrandom.workspace = true
data-encoding.workspace = true

[dev-dependencies]
tempfile.workspace = true
# Test speed only: the identity crate's lowered Argon2id floor, so the
# endpoint tests create an identity in milliseconds. Never in an app build.
ecosystem-identity = { workspace = true, features = ["insecure-test-kdf"] }
lockdown-crypto = { workspace = true, features = ["insecure-test-kdf"] }
