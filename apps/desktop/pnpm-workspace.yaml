# This directory is its own pnpm root (the extension harness under
# extension/ is another). @snds/dsa is a git dependency whose `prepare`
# script compiles TypeScript on install; nothing else may run a script.
onlyBuiltDependencies:
  - "@snds/dsa"

overrides:
  # The shared design system (03-architecture §9): @unicron/ui pins its
  # tokens by exact version, which is not on a registry; point the
  # dependency at the same tarball the app installs (unicron
  # docs/05-consuming.md §1).
  #
  # unicron 1.0 is not released yet, so both packages are the pre-release
  # tarballs vendored at the repo root, one copy for the four pnpm roots
  # (docs/plan/62-unicron-1-0.md §1). Swap to the @unicron/ui@1.0.0 and
  # @unicron/tokens@1.0.0 release URLs when Unicron 1.0 is released, and
  # delete vendor/unicron/.
  "@unicron/tokens": file:../../vendor/unicron/unicron-tokens-1.0.0-pre.2.tgz
