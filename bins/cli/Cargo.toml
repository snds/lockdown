[package]
name = "lockdown-cli"
description = "The Lockdown command-line tool (and, later, SSH agent)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "lockdown"
path = "src/main.rs"

[dependencies]
lockdown-codes.workspace = true
lockdown-matcher.workspace = true
lockdown-vault.workspace = true
lockdown-store.workspace = true
lockdown-sync.workspace = true
lockdown-crypto.workspace = true
# Opening the persona's vaults the way the app does (`vault_open`), and
# reading the pins of a shared vault's writers from its sharing record.
lockdown-app.workspace = true
ecosystem-identity.workspace = true
clap.workspace = true
serde.workspace = true
zeroize.workspace = true
# The local account's server, run inside the command (docs/plan/39-first-run.md §1.1).
lockdown-server.workspace = true

[target.'cfg(unix)'.dependencies]
# The master-password prompt turns the terminal's echo off (`master`).
libc = "0.2"

[dev-dependencies]
tempfile.workspace = true
# The forked-log test rewrites a server's log file between two clients.
rusqlite.workspace = true
# Test speed only: the identity crate's lowered Argon2id floor, so the
# binary the end-to-end test drives creates an identity in milliseconds,
# and the same floor for the OPAQUE stretching step.
ecosystem-identity = { workspace = true, features = ["insecure-test-kdf"] }
lockdown-crypto = { workspace = true, features = ["insecure-test-kdf"] }
# A throwaway CA and certificate for the end-to-end test over hybrid TLS.
lockdown-tls = { workspace = true, features = ["test-certs"] }
# The browser host's data directory, checked against the command line's
# and the app's (docs/plan/41-mac-paths.md).
lockdown-native-messaging.workspace = true
# A passwordless install, as `init` made one before every vault had a
# master password, for the tests that check such an install still opens
# (docs/plan/43-cli-sealed.md). Never in the binary itself.
lockdown-devtools = { workspace = true, default-features = false, features = ["legacy-install"] }
# A computer joined the old way, unsealed, for the test that checks such an
# install keeps opening (`test-support`, docs/plan/56-no-plain-joins.md).
# Never in the binary itself.
lockdown-app = { workspace = true, features = ["test-support"] }
