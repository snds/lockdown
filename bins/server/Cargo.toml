[package]
name = "lockdown-server"
description = "The Lockdown server: one binary for cloud and self-host"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "lockdown_server"
path = "src/lib.rs"

[[bin]]
name = "lockdown-server"
path = "src/main.rs"

[dependencies]
lockdown-crypto.workspace = true
lockdown-vault.workspace = true
lockdown-sync.workspace = true
# Security keys on the account: the relying party's checks (second_factor.rs).
lockdown-passkey.workspace = true
# The restore drill's client check (drill_account.rs): the real client signs
# in to the restored copy and reads an item back.
lockdown-app.workspace = true
axum.workspace = true
tokio = { workspace = true, features = ["sync", "signal", "time"] }
rusqlite.workspace = true
clap = { workspace = true, features = ["env"] }
data-encoding.workspace = true
serde.workspace = true
serde_bytes.workspace = true
serde_json.workspace = true
thiserror.workspace = true
# The email breach monitor's feed client (breach_monitor.rs): blocking, on
# its own thread, TLS through rustls on the `ring` provider.
reqwest = { workspace = true }
rustls = { workspace = true }
# TLS on the server itself (tls.rs): hybrid X25519MLKEM768 first, TLS 1.3.
lockdown-tls.workspace = true
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
# The encrypted server backup (backup.rs): BLAKE3 file hashes, a working
# folder beside the output, secrets wiped after use.
blake3.workspace = true
tempfile.workspace = true
zeroize.workspace = true
# The live channel's event stream (live.rs).
futures-util = { version = "0.3", default-features = false, features = ["std"] }
# Postgres beside SQLite (db.rs, `--database-url`): the driver runs on a
# small runtime of its own, the store waits on it like on the SQLite lock.
tokio-postgres = { version = "0.7", default-features = false, features = ["runtime"] }
futures-executor = { version = "0.3", default-features = false, features = ["std"] }
bytes = "1"
# Attachment bodies in an S3-compatible bucket (s3.rs): SigV4 is
# HMAC-SHA-256 over SHA-256 hashes, written here rather than pulling in an
# SDK.
hmac.workspace = true
sha2.workspace = true
# The operator's own breach feed (breach_range.rs): addresses by SHA-1
# range, as Pwned Passwords' k-anonymity does.
sha1.workspace = true
url.workspace = true
# The in-process local server (local.rs) drives the router as a tower
# service, with no socket.
tower.workspace = true

[dev-dependencies]
http-body-util.workspace = true
tempfile.workspace = true
ciborium.workspace = true
# Test speed only: the lowered Argon2id floor for the in-process OPAQUE
# clients the tests drive (07-workspace §2). Never in an app.
lockdown-crypto = { workspace = true, features = ["insecure-test-kdf"] }
# The same for the identity the restore-drill account makes in tests.
ecosystem-identity = { workspace = true, features = ["insecure-test-kdf"] }
# A throwaway CA and certificate for the TLS tests.
lockdown-tls = { workspace = true, features = ["test-certs"] }
