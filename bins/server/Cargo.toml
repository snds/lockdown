[package]
name = "lockdown-server"
description = "The Lockdown server: one binary for cloud and self-host"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "lockdown_server"
path = "src/lib.rs"

[[bin]]
name = "lockdown-server"
path = "src/main.rs"

[dependencies]
lockdown-crypto.workspace = true
lockdown-vault.workspace = true
lockdown-sync.workspace = true
axum.workspace = true
tokio = { workspace = true, features = ["sync", "signal", "time"] }
rusqlite.workspace = true
clap = { workspace = true, features = ["env"] }
data-encoding.workspace = true
serde.workspace = true
serde_bytes.workspace = true
serde_json.workspace = true
thiserror.workspace = true
# The email breach monitor's feed client (breach_monitor.rs): blocking, on
# its own thread, TLS through rustls on the `ring` provider.
reqwest = { workspace = true }
rustls = { workspace = true }
# TLS on the server itself (tls.rs): hybrid X25519MLKEM768 first, TLS 1.3.
lockdown-tls.workspace = true
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
# The encrypted server backup (backup.rs): BLAKE3 file hashes, a working
# folder beside the output, secrets wiped after use.
blake3.workspace = true
tempfile.workspace = true
zeroize.workspace = true
# The live channel's event stream (live.rs).
futures-util = { version = "0.3", default-features = false, features = ["std"] }

[dev-dependencies]
tower.workspace = true
http-body-util.workspace = true
tempfile.workspace = true
ciborium.workspace = true
# Test speed only: the lowered Argon2id floor for the in-process OPAQUE
# clients the tests drive (07-workspace §2). Never in an app.
lockdown-crypto = { workspace = true, features = ["insecure-test-kdf"] }
# A throwaway CA and certificate for the TLS tests.
lockdown-tls = { workspace = true, features = ["test-certs"] }
