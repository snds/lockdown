[package]
name = "lockdown-security"
description = "The security center's pieces that need no vault: the k-anonymity breached-password check, the bundled 2FA directory, the change-password link and the plain-words playbooks"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
lockdown-matcher.workspace = true
serde.workspace = true
serde_json.workspace = true
sha1.workspace = true
thiserror.workspace = true
zeroize.workspace = true
# The breach range client and the change-password probe: blocking, TLS
# through rustls on the `ring` provider with the hybrid X25519MLKEM768
# group first (lockdown-tls), as the sync client does.
reqwest = { workspace = true, optional = true }
lockdown-tls = { workspace = true, optional = true }

[features]
default = ["http"]
# The built-in HTTPS client. Without it (the web vault) every fetch is
# refused in plain words.
http = ["dep:reqwest", "dep:lockdown-tls"]

[dev-dependencies]
tempfile.workspace = true
