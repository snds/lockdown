[package]
name = "lockdown-app"
description = "The app on top of the core: one command surface the desktop shell uses today and the mobile shells later, with the lock timer and the secret-handling rules enforced here, not in a shell"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
lockdown-crypto.workspace = true
lockdown-vault.workspace = true
# Their native halves (the SQLite file, the HTTPS client) come with the
# default `native` feature, so a build for the web vault leaves them out
# (docs/plan/17-web-vault.md).
lockdown-store = { path = "../store", version = "0.1.0", default-features = false }
lockdown-sync = { path = "../sync", version = "0.1.0", default-features = false }
lockdown-matcher.workspace = true
lockdown-codes.workspace = true
lockdown-cxf.workspace = true
ecosystem-identity.workspace = true
serde.workspace = true
serde_bytes.workspace = true
zeroize.workspace = true
zxcvbn.workspace = true
qrcode.workspace = true
# The security center (security.rs): the breach range check, the 2FA
# directory, the change-password link, the playbooks.
lockdown-security = { path = "../security", version = "0.1.0", default-features = false }
serde_json.workspace = true
# The passkey authenticator (passkeys.rs): ES256 credentials, assertions,
# the RP ID and client-data rules.
lockdown-passkey.workspace = true
# The scan flow (scan.rs): the proximity gate and the signed activation
# pages, and the QR decoder for camera frames and image files.
lockdown-approval.workspace = true
rqrr.workspace = true
# The recovery kit's PDF (kit_pdf.rs), the same bytes on the desktop and in
# the web vault's wasm.
pdf-writer.workspace = true

[features]
default = ["native"]
# The SQLite store and the built-in HTTPS clients. Off for the web vault,
# where the vault lives in the tab's memory and the browser makes every
# request (the host installs `lockdown_sync::install_http_hook`).
native = ["lockdown-store/sqlite", "lockdown-sync/http", "lockdown-security/http"]

[dev-dependencies]
tempfile.workspace = true
# The relying party's side of the passkey tests: verify what the core signed.
ring.workspace = true
ciborium.workspace = true
# The server, in process on a random port, so the sync tests drive the
# real key-transparency log; rusqlite so one test can rewrite that log
# under the server and see the audit refuse it.
lockdown-server.workspace = true
rusqlite.workspace = true
# Test speed only: the identity crate's lowered Argon2id floor, so a test
# creates an identity in milliseconds. Never enabled in an app build.
ecosystem-identity = { workspace = true, features = ["insecure-test-kdf"] }
lockdown-crypto = { workspace = true, features = ["insecure-test-kdf"] }
