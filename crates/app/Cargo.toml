[package]
name = "lockdown-app"
description = "The app on top of the core: one command surface the desktop shell uses today and the mobile shells later, with the lock timer and the secret-handling rules enforced here, not in a shell"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
lockdown-crypto.workspace = true
lockdown-vault.workspace = true
lockdown-store.workspace = true
lockdown-sync.workspace = true
lockdown-matcher.workspace = true
lockdown-codes.workspace = true
lockdown-cxf.workspace = true
ecosystem-identity.workspace = true
serde.workspace = true
zeroize.workspace = true
zxcvbn.workspace = true
# The security center (security.rs): the breach range check, the 2FA
# directory, the change-password link, the playbooks.
lockdown-security.workspace = true
serde_json.workspace = true
# The passkey authenticator (passkeys.rs): ES256 credentials, assertions,
# the RP ID and client-data rules.
lockdown-passkey.workspace = true

[dev-dependencies]
tempfile.workspace = true
# The relying party's side of the passkey tests: verify what the core signed.
ring.workspace = true
ciborium.workspace = true
# The server, in process on a random port, so the sync tests drive the
# real key-transparency log; rusqlite so one test can rewrite that log
# under the server and see the audit refuse it.
lockdown-server.workspace = true
rusqlite.workspace = true
# Test speed only: the identity crate's lowered Argon2id floor, so a test
# creates an identity in milliseconds. Never enabled in an app build.
ecosystem-identity = { workspace = true, features = ["insecure-test-kdf"] }
lockdown-crypto = { workspace = true, features = ["insecure-test-kdf"] }
