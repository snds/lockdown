[package]
name = "lockdown-devtools"
description = "Developer tools for Lockdown's own builds: the full reset of a device and the demo. Never in a release (docs/plan/40-devtools.md)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false
# The Tauri plugin's permission files reach the desktop's build through this
# (the `devtools:` permissions, docs/plan/40-devtools.md §4).
links = "tauri-plugin-devtools"

[features]
# On for the workspace's own build and tests; the desktop takes the crate
# with `default-features = false` and turns on only what its features ask.
default = ["reset", "demo"]
# The developer reset: what is erased, the identity verdict, the erase.
reset = []
# The demo: the pack format, its loader and the demo session.
demo = [
    "dep:lockdown-cxf",
    "dep:lockdown-passkey",
    "dep:ed25519-dalek",
    "dep:sha2",
    "dep:data-encoding",
    "dep:getrandom",
    "dep:blake3",
    "dep:zeroize",
]
# The OS keystore sweep: every entry under Lockdown's service name, found
# with each platform's own search (the keyring crate can't list).
os-keystore = [
    "reset",
    "dep:keyring",
    "dep:dbus-secret-service",
    "dep:security-framework",
    "dep:windows-sys",
]
# The Tauri plugin: commands, the Developer menu, the relaunch; each part
# only with its own feature. The desktop turns this on with `dev-reset`
# (with `reset` and `os-keystore`) or `demo-vault` (with `demo`); nothing
# else does.
shell = ["dep:tauri", "dep:tauri-plugin-dialog", "dep:tauri-plugin"]

[build-dependencies]
tauri-plugin = { version = "2.7.2", optional = true, features = ["build"] }

[dependencies]
lockdown-app.workspace = true
ecosystem-identity.workspace = true
serde.workspace = true
serde_json.workspace = true
lockdown-cxf = { workspace = true, optional = true }
lockdown-vault.workspace = true
lockdown-passkey = { workspace = true, optional = true }
ed25519-dalek = { workspace = true, optional = true }
sha2 = { workspace = true, optional = true }
data-encoding = { workspace = true, optional = true }
getrandom = { workspace = true, optional = true }
blake3 = { workspace = true, optional = true }
zeroize = { workspace = true, optional = true }
keyring = { version = "3.6", features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust"], optional = true }
tauri = { version = "2.12.3", optional = true, features = [] }
tauri-plugin-dialog = { version = "2.8", optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
dbus-secret-service = { version = "4.1", optional = true, features = ["crypto-rust"] }

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = { version = "3", optional = true }

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.60", optional = true, features = ["Win32_Foundation", "Win32_Security_Credentials"] }

[dev-dependencies]
tempfile.workspace = true
# The network hold the demo sets, read back; and a real server in process
# for the reset of a profile with an account.
lockdown-sync.workspace = true
lockdown-server.workspace = true
lockdown-native-messaging.workspace = true
# Test speed only: the identity crate's lowered Argon2id floor.
ecosystem-identity = { workspace = true, features = ["insecure-test-kdf"] }
lockdown-crypto = { workspace = true, features = ["insecure-test-kdf"] }

[[example]]
name = "make-default-pack"
required-features = ["demo"]
