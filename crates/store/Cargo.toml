[package]
name = "lockdown-store"
description = "The local encrypted store: ciphertext items, manifest heads, the offline queue; the search index stays in memory"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
lockdown-vault.workspace = true
lockdown-crypto.workspace = true
ecosystem-identity.workspace = true
rusqlite = { workspace = true, optional = true }
serde.workspace = true
serde_bytes.workspace = true
thiserror.workspace = true

[features]
default = ["sqlite"]
# The SQLite file store. A build without it (the web vault, where SQLite
# does not compile and the vault lives in the tab's memory) gets
# `MemoryStore` as its `DeviceStore`.
sqlite = ["dep:rusqlite"]

[dev-dependencies]
tempfile.workspace = true
# Test speed only: the identity crate's lowered Argon2id floor (07-workspace §2).
ecosystem-identity = { workspace = true, features = ["insecure-test-kdf"] }
