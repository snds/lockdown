[package]
name = "lockdown-sync"
description = "Revisions, optimistic concurrency, conflict copies, manifest verification, the offline queue"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
lockdown-vault.workspace = true
lockdown-store = { path = "../store", version = "0.1.0", default-features = false }
lockdown-crypto.workspace = true
ecosystem-identity.workspace = true
serde.workspace = true
serde_bytes.workspace = true
thiserror.workspace = true
# The HTTP transport: blocking, TLS 1.3 through rustls on the `ring`
# provider with the hybrid X25519MLKEM768 group first (lockdown-tls; no
# aws-lc build step), certificates from the platform verifier.
reqwest = { workspace = true, optional = true }
lockdown-tls = { workspace = true, optional = true }
# The live channel's events are JSON inside server-sent events.
serde_json.workspace = true

[features]
default = ["http"]
# The built-in HTTPS client (blocking reqwest over rustls). A build
# without it (the web vault, docs/plan/17-web-vault.md) sends through the
# host's client, installed with `install_http_hook`.
http = ["dep:reqwest", "dep:lockdown-tls"]

[dev-dependencies]
tempfile.workspace = true
# Test speed only: the identity crate's lowered Argon2id floor, so a test
# creates an identity in milliseconds. Never in an app.
ecosystem-identity = { workspace = true, features = ["insecure-test-kdf"] }
