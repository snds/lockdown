[package]
name = "lockdown-sync"
description = "Revisions, optimistic concurrency, conflict copies, manifest verification, the offline queue"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
lockdown-vault.workspace = true
lockdown-store = { path = "../store", version = "0.1.0", default-features = false }
lockdown-crypto.workspace = true
ecosystem-identity.workspace = true
serde.workspace = true
serde_bytes.workspace = true
thiserror.workspace = true
# The HTTP transport: blocking, TLS through rustls on the `ring` provider
# (no aws-lc build step), certificates from the platform verifier.
reqwest = { workspace = true, optional = true }
rustls = { workspace = true, optional = true }

[features]
default = ["http"]
# The built-in HTTPS client (blocking reqwest over rustls). A build
# without it (the web vault, docs/plan/17-web-vault.md) sends through the
# host's client, installed with `install_http_hook`.
http = ["dep:reqwest", "dep:rustls"]

[dev-dependencies]
tempfile.workspace = true
# Test speed only: the identity crate's lowered Argon2id floor, so a test
# creates an identity in milliseconds. Never in an app.
ecosystem-identity = { workspace = true, features = ["insecure-test-kdf"] }
