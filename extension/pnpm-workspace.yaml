# This directory is its own pnpm root, like apps/desktop and apps/web.
# @snds/dsa (the design-system ratchet) is a git dependency whose `prepare`
# script compiles TypeScript on install; nothing else may run a script.
onlyBuiltDependencies:
  - "@snds/dsa"

overrides:
  # As apps/desktop: @unicron/ui pins its tokens by exact version, which is
  # not on a registry; point the dependency at the same vendored tarball the
  # desktop uses, so the popup and the app draw from one set of tokens.
  # Swap to the @unicron/ui@1.0.0 and @unicron/tokens@1.0.0 release URLs
  # when Unicron 1.0 is released, and delete vendor/unicron/
  # (docs/plan/62-unicron-1-0.md §1).
  "@unicron/tokens": file:../vendor/unicron/unicron-tokens-1.0.0-pre.2.tgz
