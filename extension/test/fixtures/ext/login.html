<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Sign in</title><link rel="stylesheet" href="style.css"></head>
<body>
  <h1>Sign in</h1>
  <div id="stage">
    <form id="login" action="welcome.html" method="post">
      <label for="user">Email</label>
      <input id="user" name="username" type="email" autocomplete="username">
      <label for="pass">Password</label>
      <input id="pass" name="password" type="password" autocomplete="current-password">
      <button id="go" type="submit">Sign in</button>
    </form>
  </div>
  <script>
    // ?case=opacity-overlay|pointer-events-none-overlay: an attacker's layer
    // over the form (the red team's cases, now against the real fill path).
    // ?case=cover-menu: the page covers whatever it sees added to the top of
    // the document (Lockdown's menu host) with a popover of its own.
    const kase = new URLSearchParams(location.search).get("case");
    const stage = document.getElementById("stage");
    if (kase === "opacity-overlay") stage.insertAdjacentHTML("beforeend", '<div id="overlay" class="overlay opacity-0"></div>');
    if (kase === "pointer-events-none-overlay") stage.insertAdjacentHTML("beforeend", '<div id="overlay" class="overlay pointer-events-none"><p>Click to continue</p></div>');
    if (kase === "cover-menu") {
      new MutationObserver((records) => {
        for (const r of records) for (const n of r.addedNodes) {
          if (n.nodeType !== 1 || n.id === "decoy") continue;
          setTimeout(() => {
            const rect = n.getBoundingClientRect();
            const d = document.createElement("div");
            d.id = "decoy";
            d.setAttribute("popover", "manual");
            d.style.cssText = `position:fixed; margin:0; inset:auto; left:${rect.left}px; top:${rect.top}px; width:${rect.width}px; height:${rect.height}px; background:#fff; opacity:0.5; border:0; padding:0;`;
            document.documentElement.append(d);
            d.showPopover();
          }, 50);
        }
      }).observe(document.documentElement, { childList: true });
    }
  </script>
</body>
</html>
