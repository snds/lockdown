<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Shipping</title><link rel="stylesheet" href="style.css"></head>
<body>
  <h1>Where should we send it?</h1>
  <form id="ship" onsubmit="return false">
    <label for="given">First name</label>
    <input id="given" autocomplete="given-name">
    <label for="family">Last name</label>
    <input id="family" autocomplete="family-name">
    <label for="email">Email</label>
    <input id="email" type="email" autocomplete="email">
    <label for="city">City</label>
    <input id="city" autocomplete="address-level2">
    <label for="zip">Postal code</label>
    <input id="zip" autocomplete="postal-code">
  </form>
</body>
</html>
