<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Members</title><link rel="stylesheet" href="style.css"></head>
<body>
  <h1>Members</h1>
  <!-- A sign-in form whose markup misleads a password manager: the
       username field says nothing about being one. A fill fix says it is. -->
  <form id="login" action="welcome.html" method="post">
    <label for="member">Member number</label>
    <input id="member" name="member">
    <label for="pin">Secret</label>
    <input id="pin" name="pin" type="password">
    <button id="go" type="submit">Enter</button>
  </form>
</body>
</html>
