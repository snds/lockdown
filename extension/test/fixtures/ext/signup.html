<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Create an account</title><link rel="stylesheet" href="style.css"></head>
<body>
  <h1>Create an account</h1>
  <form id="signup" action="welcome.html" method="post">
    <label for="user">Username</label>
    <input id="user" name="username" autocomplete="username">
    <label for="pass">Password</label>
    <input id="pass" name="password" type="password" autocomplete="new-password">
    <label for="again">Password again</label>
    <input id="again" name="again" type="password" autocomplete="new-password">
    <button id="go" type="submit">Create account</button>
  </form>
</body>
</html>
