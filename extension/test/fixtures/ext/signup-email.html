<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Join</title><link rel="stylesheet" href="style.css"></head>
<body>
  <h1>Join</h1>
  <form id="signup" action="welcome.html" method="post">
    <label for="email">Email</label>
    <input id="email" name="email" type="email" autocomplete="email">
    <label for="pass">Password</label>
    <input id="pass" name="password" type="password" autocomplete="new-password">
    <button id="go" type="submit">Join</button>
  </form>
</body>
</html>
