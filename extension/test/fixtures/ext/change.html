<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Change your password</title><link rel="stylesheet" href="style.css"></head>
<body>
  <h1>Change your password</h1>
  <form id="change" action="welcome.html" method="post">
    <label for="old">Current password</label>
    <input id="old" name="old" type="password" autocomplete="current-password">
    <label for="new">New password</label>
    <input id="new" name="new" type="password" autocomplete="new-password">
    <button id="go" type="submit">Change password</button>
  </form>
</body>
</html>
