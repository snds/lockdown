<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Clickjacking harness</title>
  <style>
    body { margin: 0; padding: 24px; font: 16px system-ui, sans-serif; background: #f6f6f6; }
    #stage { position: relative; width: 420px; }
    iframe { width: 400px; height: 260px; border: 1px solid #999; background: #fff; }
    label { display: block; margin: 8px 0 4px; }
    input { display: block; width: 240px; padding: 8px; font-size: 16px; }
    /* An attacker's overlays. Both sit over the password field. */
    .overlay { position: absolute; left: 0; top: 0; width: 100%; height: 100%; }
    .overlay.opacity-0 { opacity: 0; background: #c00; }
    .overlay.pointer-events-none { pointer-events: none; background: #fff; }
    .overlay.pointer-events-none p { margin: 0; padding: 12px; }
  </style>
</head>
<body>
  <h1>Harness</h1>
  <p id="case-name"></p>
  <div id="stage"></div>
  <script>
    // ?case=cross-origin|same-origin|opacity-overlay|pointer-events-none-overlay|control
    // &frame=<origin of the frame page>
    const params = new URLSearchParams(location.search);
    const kase = params.get("case") || "control";
    const frameOrigin = params.get("frame") || location.origin;
    document.getElementById("case-name").textContent = kase;
    const stage = document.getElementById("stage");
    const form = `
      <form id="login" action="#" onsubmit="return false">
        <label for="user">Username</label>
        <input id="user" name="username" autocomplete="username">
        <label for="pass">Password</label>
        <input id="pass" name="password" type="password" autocomplete="current-password">
      </form>`;
    switch (kase) {
      case "cross-origin":
      case "same-origin":
        stage.innerHTML = `<iframe id="frame" src="${frameOrigin}/frame.html"></iframe>`;
        break;
      case "opacity-overlay":
        // Invisible to the eye, but it is what a click lands on.
        stage.innerHTML = form + `<div id="overlay" class="overlay opacity-0"></div>`;
        break;
      case "pointer-events-none-overlay":
        // Opaque decoy the person sees; clicks pass straight through to the
        // field underneath (the DEF CON 33 trick).
        stage.innerHTML = form + `<div id="overlay" class="overlay pointer-events-none"><p>Click to continue reading</p></div>`;
        break;
      default:
        stage.innerHTML = form;
    }
  </script>
  <script type="module" src="/harness.js"></script>
</body>
</html>
