# Reproducible builds (docs/plan/24-release.md §5,
# docs/plan/29-release-polish.md §1): the browser extension's store
# packages, the server and CLI binaries, the server image, the Linux
# desktop packages (deb, rpm) and the Flatpak's files and OSTree commit are
# each built twice, on two different runner images, from the same commit,
# and must match. The Flatpak bundle file's own bytes, and the macOS and Windows
# bundles (built on two runner images each outside pull requests), are
# compared and reported, not required; doc 29 says what differs and why.
name: Reproducible

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: reproducible-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: build on ${{ matrix.runner }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-22.04]
    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: "0"
      # The checkout and the cargo home leave the binaries; both runner
      # images use the same paths, and the remap makes that not matter.
      RUSTFLAGS: --remap-path-prefix=${{ github.workspace }}=/lockdown --remap-path-prefix=/home/runner/.cargo=/cargo
    steps:
      - uses: actions/checkout@v4
      - name: SOURCE_DATE_EPOCH from the commit
        run: echo "SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown,wasm32-wasip1
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen-cli@0.2.129
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: extension/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Extension store packages
        working-directory: extension
        run: pnpm install --frozen-lockfile && pnpm build:wasm && pnpm build && pnpm run package
      - uses: docker/setup-buildx-action@v3
      - name: Web vault (the image carries it; its core built in the pinned image)
        run: |
          env -u RUSTFLAGS packaging/repro/build-web.sh
          cd apps/web && pnpm install --frozen-lockfile && pnpm build
      - name: Server and CLI binaries
        run: env -u RUSTFLAGS packaging/repro/build-server.sh out
      - name: Server image
        run: env -u RUSTFLAGS packaging/repro/build-image.sh out
      - name: Hashes
        run: |
          {
            (cd extension/dist/packages && sha256sum *.zip)
            (cd out && cat SHA256SUMS)
            echo "$(python3 packaging/repro/oci-file-hash.py out/lockdown-server-image.oci.tar usr/local/bin/lockdown-server)  image:/usr/local/bin/lockdown-server"
            # The web vault's files, so a difference in the image is easy to place.
            (cd apps/web/dist && find . -type f -print0 | sort -z | xargs -0 sha256sum | sed 's#  \./#  web:#')
          } | sort -k 2 > hashes.txt
          cat hashes.txt
      - uses: actions/upload-artifact@v4
        with:
          name: hashes-${{ matrix.runner }}
          path: hashes.txt
      - uses: actions/upload-artifact@v4
        if: failure() || runner.debug == '1'
        with:
          name: outputs-${{ matrix.runner }}
          path: |
            extension/dist/packages/*.zip
            out/lockdown-server
            out/lockdown
          if-no-files-found: ignore

  compare:
    name: same bytes both times
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: hashes-*
      - name: Compare
        run: |
          a=hashes-ubuntu-24.04/hashes.txt
          b=hashes-ubuntu-22.04/hashes.txt
          cat "$a"
          if ! diff -u "$a" "$b"; then
            echo "::error::a build differs between the two runners (lines above)"
            exit 1
          fi
          # The server inside the image is the published binary.
          server=$(awk '$2 == "lockdown-server" {print $1}' "$a")
          inside=$(awk '$2 == "image:/usr/local/bin/lockdown-server" {print $1}' "$a")
          [ -n "$server" ] && [ "$server" = "$inside" ] || { echo "::error::the image's server differs from the binary"; exit 1; }
          echo "reproducible: $(wc -l < "$a") files, identical on both runners"

  # The Linux desktop packages, built in the pinned container
  # (packaging/repro/build-desktop.sh) on two runner images.
  desktop:
    name: desktop packages on ${{ matrix.runner }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-22.04]
    steps:
      - uses: actions/checkout@v4
      - name: SOURCE_DATE_EPOCH from the commit
        run: echo "SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)" >> "$GITHUB_ENV"
      - name: The package normaliser's own test
        run: python3 packaging/repro/test_normalize_package.py
      - name: deb, rpm and the release binaries (pinned container)
        run: packaging/repro/build-desktop.sh out
      - name: Hashes
        run: |
          {
            (cd out && sha256sum *.deb *.rpm stage/*)
            # Each package's files, so a difference is easy to place.
            mkdir x && dpkg-deb -x out/*.deb x
            (cd x && find . -type f -print0 | sort -z | xargs -0 sha256sum | sed 's#  \./#  deb:#')
          } | sort -k 2 > desktop-hashes.txt
          cat desktop-hashes.txt
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-hashes-${{ matrix.runner }}
          path: desktop-hashes.txt
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-stage-${{ matrix.runner }}
          path: out/stage/*
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: failure() || runner.debug == '1'
        with:
          name: desktop-packages-${{ matrix.runner }}
          path: out/*.*
          if-no-files-found: ignore

  # The Flatpak from each runner's own release binaries, in the
  # digest-pinned flatpak-builder image.
  flatpak:
    name: flatpak on ${{ matrix.runner }}
    needs: desktop
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-22.04]
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-47@sha256:8ac0732eb12cfdaa9a12c083718c3809fb5ae95af6d67bc182ef7140da69caec
      options: --privileged
    steps:
      - uses: actions/checkout@v4
      - name: SOURCE_DATE_EPOCH from the commit
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          echo "SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@v4
        with:
          name: desktop-stage-${{ matrix.runner }}
          path: stage
      - name: Build, re-commit at the commit's time, bundle
        run: packaging/repro/build-flatpak.sh stage out
      - uses: actions/upload-artifact@v4
        with:
          name: flatpak-hashes-${{ matrix.runner }}
          path: |
            out/flatpak-hashes.txt
            out/flatpak-files.txt
            out/flatpak-manifest.json

  desktop-compare:
    name: desktop packages, same bytes both times
    needs: desktop
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: desktop-hashes-*
      - name: Compare
        run: |
          a=desktop-hashes-ubuntu-24.04/desktop-hashes.txt
          b=desktop-hashes-ubuntu-22.04/desktop-hashes.txt
          cat "$a"
          if ! diff -u "$a" "$b"; then
            echo "::error::a desktop package differs between the two runners (lines above)"
            exit 1
          fi
          echo "reproducible: $(wc -l < "$a") desktop files, identical on both runners"

  flatpak-compare:
    name: flatpak, same files and commit both times
    needs: flatpak
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: flatpak-hashes-*
      - name: Compare
        run: |
          fa=flatpak-hashes-ubuntu-24.04
          fb=flatpak-hashes-ubuntu-22.04
          cat "$fa/flatpak-hashes.txt" "$fb/flatpak-hashes.txt"
          diff -u "$fa/flatpak-manifest.json" "$fb/flatpak-manifest.json" || true
          # Required: the Flatpak's files (OSTree stores no file times).
          if ! diff -u "$fa/flatpak-files.txt" "$fb/flatpak-files.txt"; then
            echo "::error::the Flatpak's files differ between the two runners"
            exit 1
          fi
          # Required too: the OSTree commit, re-made at the commit's time.
          if [ "$(grep flatpak:commit "$fa/flatpak-hashes.txt")" != "$(grep flatpak:commit "$fb/flatpak-hashes.txt")" ]; then
            echo "::error::the Flatpak's OSTree commit differs between the two runners"
            exit 1
          fi
          # Reported: the bundle file around the commit.
          if [ "$(grep flatpak:bundle "$fa/flatpak-hashes.txt")" = "$(grep flatpak:bundle "$fb/flatpak-hashes.txt")" ]; then
            echo "flatpak bundle: identical on both runners"
          else
            echo "flatpak bundle: differs between the runners (reported, not required; docs/plan/29-release-polish.md §1)"
          fi
          echo "reproducible: the Flatpak's files and its OSTree commit, identical on both runners"

  # macOS and Windows bundles on two runner images each, compared and
  # reported (never failing the run): built on pushes to main and by hand,
  # not on every pull request, because each is a full release build.
  other-platforms:
    name: ${{ matrix.runner }} bundles (report)
    if: github.event_name != 'pull_request'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-14, macos-15, windows-2022, windows-2025]
    defaults:
      run:
        shell: bash
    env:
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@v4
      - name: SOURCE_DATE_EPOCH and remapped paths
        run: |
          echo "SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)" >> "$GITHUB_ENV"
          echo "RUSTFLAGS=--remap-path-prefix=$GITHUB_WORKSPACE=/lockdown --remap-path-prefix=$HOME/.cargo=/cargo" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ startsWith(matrix.runner, 'macos') && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: apps/desktop/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build and bundle, unsigned
        working-directory: apps/desktop
        run: |
          pnpm install --frozen-lockfile
          if [ "${RUNNER_OS}" = macOS ]; then
            # The newest Xcode both macOS images carry, so the comparison
            # isn't only between two linkers (their defaults are 15.4 and 16.4).
            sudo xcode-select -s /Applications/Xcode_16.2.app
            node scripts/stage-host.mjs --universal --release
            pnpm tauri build --ci --target universal-apple-darwin --bundles app,dmg --config src-tauri/tauri.bundle.conf.json
          else
            node scripts/stage-host.mjs --release
            pnpm tauri build --ci --bundles msi,nsis --config src-tauri/tauri.bundle.conf.json
          fi
      - name: Hashes of each bundle and the files in it
        run: |
          {
            rustc --version
            if [ "${RUNNER_OS}" = macOS ]; then
              # sed reads all of it: head would close the pipe and xcodebuild aborts.
              echo "info: $(xcodebuild -version | sed -n 1p), installed: $(ls /Applications | grep '^Xcode_' | tr '\n' ' ')"
              b=target/universal-apple-darwin/release/bundle
              for bin in "$b"/macos/*.app/Contents/MacOS/*; do
                echo "info: $(basename "$bin") $(dwarfdump --uuid "$bin" | awk '{print $2, $3}' | tr '\n' ' ')"
              done
              (cd "$b/dmg" && shasum -a 256 *.dmg | sed 's#  #  dmg:#')
              (cd "$b/macos" && find . -type f -print0 | sort -z | xargs -0 shasum -a 256 | sed 's#  \./#  app:#')
            else
              # Git Bash's sha256sum marks binary mode with " *".
              h() { sha256sum "$@" | sed 's# \*#  #'; }
              b=target/release/bundle
              (cd "$b/msi" && h *.msi | sed 's#  #  msi:#')
              (cd "$b/nsis" && h *.exe | sed 's#  #  nsis:#')
              (cd target/release && h lockdown-desktop.exe lockdown-native-host.exe | sed 's#  #  exe:#')
              python packaging/repro/pe-info.py target/release/lockdown-desktop.exe target/release/lockdown-native-host.exe | sed 's/^/info: /'
            fi
          } > other-hashes.txt
          cat other-hashes.txt
      - uses: actions/upload-artifact@v4
        with:
          name: other-hashes-${{ matrix.runner }}
          path: other-hashes.txt

  other-report:
    name: macOS and Windows bundles (report)
    needs: other-platforms
    if: always() && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: other-hashes-*
      - name: What matches and what differs
        run: |
          for pair in "macos-14 macos-15" "windows-2022 windows-2025"; do
            set -- $pair
            a=other-hashes-$1/other-hashes.txt
            b=other-hashes-$2/other-hashes.txt
            {
              echo "### $1 vs $2"
              if [ ! -f "$a" ] || [ ! -f "$b" ]; then
                echo "a build did not finish"
              else
                echo '```'
                grep -v '  ' "$a" | sed "s/^/$1: /"
                grep -v '  ' "$b" | sed "s/^/$2: /"
                echo '```'
                echo "| file | same bytes |"
                echo "|---|---|"
                join -1 2 -2 2 <(grep '  ' "$a" | sort -k 2) <(grep '  ' "$b" | sort -k 2) \
                  | awk '{ print "| " $1 " | " ($2 == $3 ? "yes" : "no") " |" }'
              fi
            } | tee -a "$GITHUB_STEP_SUMMARY"
          done
