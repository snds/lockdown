name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  check:
    name: fmt · clippy · test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace

  deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check

  # The extension boundary (docs/plan/09-extension-boundary.md): build the
  # wasm, then replay the clickjacking red team in a real Chromium.
  extension:
    name: wasm · playwright
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: extension
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      # The CLI must equal the crate pin in crates/wasm/Cargo.toml;
      # build-wasm.sh refuses to run otherwise.
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen-cli@0.2.129
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: extension/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: extension/pnpm-lock.yaml
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Build wasm
        run: pnpm run build:wasm
      - name: Red team in the browser
        run: pnpm test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: extension/test-results
          if-no-files-found: ignore
