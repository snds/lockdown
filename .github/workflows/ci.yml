name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  check:
    name: fmt · clippy · test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      # Every test binary runs even when one fails, so one run shows every
      # platform failure (Windows joined the matrix in doc 24).
      - name: Test
        run: cargo test --workspace --no-fail-fast
      # The generator's statistical tests by name, so a run shows them
      # (docs/plan/21-vault-depth.md): chi-squared, NIST monobit and runs.
      - name: Generator randomness
        run: cargo test -p lockdown-crypto --lib generator::tests::stats

  deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check

  # The extension (docs/plan/16-browser-extension.md) and the boundary it
  # stands on (docs/plan/09-extension-boundary.md): build the wasm, the
  # native host and the desktop endpoint fixture, typecheck and build the
  # MV3 extension for Chromium and Firefox, then run the clickjacking red
  # team and the end-to-end suite (the unpacked build in Chromium, the real
  # host, the real endpoint over a throwaway vault).
  extension:
    name: wasm · extension · playwright
    # Pinned: ubuntu-latest moved to 26.04, where Playwright 1.56 can't
    # install its browser dependencies. Move back with the next Playwright.
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    defaults:
      run:
        working-directory: extension
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      # The CLI must equal the crate pin in crates/wasm/Cargo.toml;
      # build-wasm.sh refuses to run otherwise.
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen-cli@0.2.129
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: extension/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: extension/pnpm-lock.yaml
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Chromium and Firefox
        run: pnpm exec playwright install --with-deps chromium firefox
      - name: Build wasm
        run: pnpm run build:wasm
      - name: Build the native host and the desktop endpoint fixture
        run: pnpm run build:native
      - name: Typecheck the extension
        run: pnpm typecheck
      - name: Build the extension (Chromium and Firefox)
        run: pnpm build
      # The popup is on unicron (docs/plan/26-desktop-finish.md §9): the same
      # design-system ratchet the desktop runs, over the popup's own files.
      - name: Design-system ratchet (popup)
        run: pnpm ds:ratchet
      # Firefox runs too (test/firefox.spec.ts); here a missing Firefox is
      # a failure, not a skip.
      - name: Red team and end to end in the browser
        env:
          LOCKDOWN_REQUIRE_FIREFOX: "1"
        run: pnpm test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: extension/test-results
          if-no-files-found: ignore

  # The desktop shell (docs/plan/10-desktop-shell.md): the web UI's
  # typecheck, lint, component tests and build, the design-system ratchet,
  # and the Tauri crate with its `shell` feature on, which is the one place
  # WebKitGTK is needed (the root `--workspace` jobs never pull it).
  desktop:
    name: desktop shell
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@v4
      - name: Install WebKitGTK and friends (Tauri Linux deps; dbus for the keychain)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev libdbus-1-dev libxdo-dev pkg-config
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: apps/desktop/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/desktop/pnpm-lock.yaml
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm typecheck
      - name: Lint
        run: pnpm lint
      - name: Component tests
        run: pnpm test
      - name: Build the web UI
        run: pnpm build
      - name: Design-system ratchet
        run: pnpm ds:ratchet
      # The shell embeds dist/ (built above), so generate_context! has it.
      - name: Clippy, the shell feature on
        run: cargo clippy -p lockdown-desktop --all-targets --features shell -- -D warnings
      - name: Shell unit tests
        run: cargo test -p lockdown-desktop --features shell

  # The design-review harness (design/capture/README.md): its typecheck,
  # which also checks the desktop's, the web vault's and the extension's
  # sources it imports, and its lint. The capture itself drives a browser
  # and writes outside the repo, so it runs on a person's machine, not here.
  design-capture:
    name: design capture harness · typecheck · lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: design/capture
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: design/capture/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: design/capture/pnpm-lock.yaml
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm typecheck
      - name: Lint
        run: pnpm lint

  # The web vault (docs/plan/17-web-vault.md): lockdown-app built for
  # wasm32-wasip1 (ring's C needs clang, which the runner has), the page's
  # typecheck, lint, unit tests (the shim and the real module among them)
  # and build, then the end-to-end suite: the real server on a throwaway
  # database serving the built page, the account made with the CLI, the
  # page driven in Chromium.
  web:
    name: web vault · wasm · playwright
    # Pinned: ubuntu-latest moved to 26.04, where Playwright 1.56 can't
    # install its browser dependencies. Move back with the next Playwright.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip1
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: apps/web/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Build the core (wasm32-wasip1)
        run: pnpm build:wasm
      - name: Typecheck
        run: pnpm typecheck
      - name: Lint
        run: pnpm lint
      - name: Unit tests
        run: pnpm test
      - name: Build the page
        run: pnpm build
      - name: Build the server and the CLI
        run: cargo build -p lockdown-server -p lockdown-cli
      - name: End to end in Chromium
        run: pnpm e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: web-vault-traces
          path: apps/web/test-results
          if-no-files-found: ignore

  # Hybrid post-quantum TLS (docs/plan/20-self-host-server.md §2): the
  # handshake tests, with Node's OpenSSL 3.5 as an independent client and
  # server for X25519MLKEM768; `require` fails the job if that OpenSSL is
  # missing instead of skipping the interop.
  tls-interop:
    name: hybrid TLS · OpenSSL interop
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Handshakes, including OpenSSL both ways
        env:
          LOCKDOWN_TLS_INTEROP: require
        run: cargo test -p lockdown-tls

  # The server image (single-container; docs/self-host.md): built from the
  # Dockerfile and never pushed anywhere, then run read-only with a
  # throwaway certificate and driven by the real CLI: health, register,
  # sync, a second device's recovery, a backup, the memory it uses.
  container:
    name: container image · smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: docker/setup-buildx-action@v3
      - name: Build the image (loaded locally, not pushed)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: lockdown-server:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build the CLI
        run: cargo build --release -p lockdown-cli
      - name: Smoke test
        run: bins/server/container/smoke.sh lockdown-server:ci target/release/lockdown

  # The desktop shell on Windows (docs/plan/24-release.md §1): the Tauri
  # crate with its `shell` feature on (WebView2, Windows Hello, Credential
  # Manager), its clippy and unit tests, the browser endpoint on the named
  # pipe among them. The installers are built by release.yml.
  desktop-windows:
    name: desktop shell (windows)
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: apps/desktop/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/desktop/pnpm-lock.yaml
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Build the web UI
        run: pnpm build
      - name: Clippy, the shell feature on
        run: cargo clippy -p lockdown-desktop --all-targets --features shell -- -D warnings
      - name: Shell unit tests
        run: cargo test -p lockdown-desktop --features shell

  # Supply chain (docs/plan/24-release.md §4): every third-party crate in
  # Cargo.lock is covered by an audit imported from a well-known audit set
  # or by a recorded exemption in supply-chain/. `--locked` reads the
  # imports from supply-chain/imports.lock and fetches nothing. A new or
  # updated crate fails this job until it is audited or exempted
  # (`cargo vet` says which; `cargo vet regenerate exemptions` records it).
  vet:
    name: cargo-vet
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-vet@0.10.2
      - name: Vet
        run: cargo vet --locked

  # The second storage pass (docs/plan/25-self-host-2.md §2–§3): the
  # server's whole test suite, and every crate that drives a server in
  # process, again against Postgres (a service container), and the
  # attachment bucket against MinIO built from its source at a pinned
  # commit (no published image is pulled). The tests reach nothing but these
  # two services on this runner.
  storage-backends:
    name: server · Postgres · MinIO
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: lockdown
          POSTGRES_PASSWORD: lockdown
          POSTGRES_DB: lockdown_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U lockdown"
          --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache: false
      - name: MinIO, built from source at a pinned commit
        run: |
          GOBIN="$RUNNER_TEMP/bin" go install github.com/minio/minio@v0.0.0-20260212201848-7aac2a2c5b7c
          mkdir -p "$RUNNER_TEMP/minio-data"
          MINIO_ROOT_USER=lockdowntest MINIO_ROOT_PASSWORD=lockdowntest-secret \
            nohup "$RUNNER_TEMP/bin/minio" server "$RUNNER_TEMP/minio-data" --address 127.0.0.1:9000 \
            > "$RUNNER_TEMP/minio.log" 2>&1 &
          for i in $(seq 1 60); do curl -sf http://127.0.0.1:9000/minio/health/live && exit 0; sleep 1; done
          cat "$RUNNER_TEMP/minio.log"; exit 1
      - name: Server, CLI, app and web tests against Postgres and MinIO
        env:
          LOCKDOWN_TEST_SERVICES: require
          LOCKDOWN_TEST_DATABASE_URL: postgres://lockdown:lockdown@127.0.0.1:5432/lockdown_test?sslmode=disable
          LOCKDOWN_TEST_S3_ENDPOINT: http://127.0.0.1:9000
          LOCKDOWN_TEST_S3_ACCESS_KEY: lockdowntest
          LOCKDOWN_TEST_S3_SECRET_KEY: lockdowntest-secret
        run: cargo test -p lockdown-server -p lockdown-cli -p lockdown-app -p lockdown-web

  # Code signatures on the browser channel (docs/plan/29-release-polish.md
  # §2): the test binary (playing the app) and copies of a peer (playing
  # the host) are signed with two throwaway certificates made in the job,
  # never a real identity; then each signed end must accept the same signer
  # and refuse another signer, an unsigned peer and (macOS) another
  # identifier, both ways, over the real socket with its audit token.
  codesign-macos:
    name: code signatures (macos)
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build the test and the peer
        run: |
          cargo build -p lockdown-codesign --example peer
          test=$(cargo test -p lockdown-codesign --test signed --no-run --message-format=json \
            | jq -r 'select(.reason == "compiler-artifact" and .target.name == "signed" and .profile.test) | .executable')
          echo "TEST_BIN=$test" >> "$GITHUB_ENV"
      - name: Throwaway certificates; sign
        run: packaging/codesign/throwaway-macos.sh "$RUNNER_TEMP/signed" "$TEST_BIN" target/debug/examples/peer >> "$GITHUB_ENV"
      - name: Signed ends check each other
        env:
          LOCKDOWN_CODESIGN_TEST: require
        run: '"$LOCKDOWN_CODESIGN_APP_TEST" --nocapture'

  codesign-windows:
    name: code signatures (windows)
    runs-on: windows-latest
    timeout-minutes: 25
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build the test and the peer
        run: |
          cargo build -p lockdown-codesign --example peer
          test=$(cargo test -p lockdown-codesign --test signed --no-run --message-format=json \
            | jq -r 'select(.reason == "compiler-artifact" and .target.name == "signed" and .profile.test) | .executable')
          echo "TEST_BIN=$test" >> "$GITHUB_ENV"
      - name: Throwaway certificates; sign
        shell: pwsh
        run: pwsh packaging/codesign/throwaway-windows.ps1 -Out "$env:RUNNER_TEMP\signed" -TestBin "$env:TEST_BIN" -PeerBin target\debug\examples\peer.exe
      - name: Signed ends check each other
        shell: pwsh
        env:
          LOCKDOWN_CODESIGN_TEST: require
        run: '& $env:LOCKDOWN_CODESIGN_APP_TEST --nocapture'
      - name: Forget the throwaway certificates
        if: always()
        shell: pwsh
        run: |
          Get-ChildItem Cert:\LocalMachine\Root, Cert:\CurrentUser\My | Where-Object { $_.Subject -like "CN=Lockdown throwaway test signer*" } | Remove-Item
